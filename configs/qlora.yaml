method: "qlora"
base_model_id: "google/gemma-2-2b-it"
load_in_4bit: true

quantization:
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: "bfloat16"

peft:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  num_train_epochs: 3
  min_optimizer_steps_floor: 100
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4
  effective_batch_size: 16
  optim: "paged_adamw_8bit"
  weight_decay: 0.01
  max_seq_length: 1024
  packing: false
  seed: 42
  eval_strategy: "epoch"
  save_strategy: "epoch"
  metric_for_best_model: "task_c2_micro_f1"
